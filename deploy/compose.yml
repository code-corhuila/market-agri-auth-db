# Deliberate migration runner. PostgreSQL and auth_app are owned by infra.
# ENV (dev | qa | main) is also the Liquibase context: changesets with contextFilter
# "dev,qa" (seed users) are skipped in main; changesets without one always run.
services:
  auth-db-migrate:
    image: liquibase/liquibase:4.29
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/workspace:ro
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changelog-file=changelog/changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      - --username=${PG_ADMIN_USER:?set PG_ADMIN_USER}
      - --password=${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD}
      - --database-changelog-table-name=databasechangelog_auth
      - --database-changelog-lock-table-name=databasechangeloglock_auth
      - "--contexts=${ENV:?set ENV}"         # seed users run only in dev and qa (D-20)
    command: [update]
    networks: [platform]

networks:
  platform:
    name: platform-${ENV:?set ENV}
    external: true
